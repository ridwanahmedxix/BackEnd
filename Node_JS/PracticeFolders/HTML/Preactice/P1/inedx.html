<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Table</title>
  </head>
  <body>
    <table
      border="1"
      width="500px"
      height="300px"
      style="border-collapse: collapse; text-align: center; padding: 10px 5px"
    >
      <tr>
        <td>1</td>
        <td>1</td>
      </tr>
      <tr>
        <td colspan="2">1</td>
      </tr>
      <tr>
        <td>1</td>
        <td>1</td>
      </tr>
    </table>
  </body>
</html>
